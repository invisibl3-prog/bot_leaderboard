<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Leaderboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 20px 60px 20px; 
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Random Viewport Glow Aura */
    #ambient-glow-aura {
      position: fixed;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 0;
      transition: top 4s ease-in-out, left 4s ease-in-out, opacity 2s ease-in-out, filter 3s ease-in-out;
      filter: blur(7px); 
      opacity: 0;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Background Floating Particles */
    #particles-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-5vh) translateX(20px); opacity: 0; }
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { 
      font-size: 2.5rem; 
      letter-spacing: 3px; 
      margin-bottom: 8px; 
      text-transform: uppercase; 
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); 
    }
    .timer { font-size: 0.9rem; color: #666; margin-bottom: 50px; }

    .leaderboard-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    /* Transparent Player Box with Crisp White Borders */
    .player-box {
      background-color: transparent; 
      border: 3px solid #ffffff; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      width: 100%;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    /* Custom Layout Sizes based on blueprint */
    .place-1 { max-width: 550px; padding: 30px 25px; border-width: 4px; }
    .place-2 { max-width: 450px; padding: 22px 20px; }
    .place-3 { max-width: 350px; padding: 16px 15px; }
    .place-rest { max-width: 300px; padding: 12px 15px; border-width: 2px; }

    /* Dynamic Podium Hover Shifts */
    .place-1:hover {
      transform: scale(1.03);
      border-color: #ffd700; 
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6); 
    }
    .place-2:hover {
      transform: scale(1.03);
      border-color: #c0c0c0; 
      box-shadow: 0 0 22px rgba(192, 192, 192, 0.5); 
    }
    .place-3:hover {
      transform: scale(1.03);
      border-color: #cd7f32; 
      box-shadow: 0 0 18px rgba(205, 127, 50, 0.5); 
    }
    .place-rest:hover {
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.35); 
    }

    /* Typography & Alignments */
    .player-info { display: flex; align-items: center; gap: 15px; }
    .rank-num { font-weight: 900; font-size: 1.2rem; min-width: 35px; color: #888; }
    .place-1 .rank-num { color: #ffd700; font-size: 1.6rem; }
    .place-2 .rank-num { color: #c0c0c0; }
    .place-3 .rank-num { color: #cd7f32; }
    
    .username-container { display: flex; flex-direction: column; }
    .username { font-weight: 600; font-size: 1.1rem; letter-spacing: 0.5px; }
    .place-1 .username { font-size: 1.4rem; }
    .tier-badge { font-size: 0.8rem; color: #888; text-transform: uppercase; margin-top: 2px; }

    .stats { text-align: right; font-family: monospace; font-size: 1rem; color: #eee; min-width: 90px; }
    .elo-display { font-weight: bold; font-size: 1.1rem; }

    /* Custom Color-Coded Win/Loss Elements */
    .win-text { color: #4eff4e; font-weight: bold; }       
    .divider-text { color: #666666; margin: 0 1px; }       
    .loss-text { color: #ff4e4e; font-weight: bold; }      

    /* Clean Faded Design for N/A Elements */
    .na-box {
      opacity: 0.35;
    }
  </style>
</head>
<body>

  <div id="ambient-glow-aura"></div>
  <div id="particles-container"></div>

  <div class="content-wrapper">
    <h1>Arena Leaderboard</h1>
    <p class="timer" id="update-timer">Next Sync: 10:00</p>

    <div class="leaderboard-container" id="leaderboard-target"></div>
  </div>

  <script>
    // Floating background particles
    const container = document.getElementById('particles-container');
    for (let i = 0; i < 35; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      const size = Math.random() * 3 + 1;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.animationDuration = `${Math.random() * 8 + 6}s`;
      particle.style.animationDelay = `${Math.random() * 5}s`;
      container.appendChild(particle);
    }

    // Background Glow Positions Engine
    const glowAura = document.getElementById('ambient-glow-aura');
    function triggerRandomBackgroundGlow() {
      const randomX = Math.random() * 100;
      const randomY = Math.random() * 100;
      const randomOpacity = Math.random() * 0.09 + 0.04; 
      
      glowAura.style.left = `${randomX}%`;
      glowAura.style.top = `${randomY}%`;
      glowAura.style.opacity = randomOpacity;

      setTimeout(triggerRandomBackgroundGlow, Math.random() * 4000 + 4000);
    }
    triggerRandomBackgroundGlow();

    let timeLeft = 600;

    async function loadLeaderboard() {
      try {
        const response = await fetch('/api/leaderboard');
        const players = await response.json();
        
        const container = document.getElementById('leaderboard-target');
        container.innerHTML = ''; 

        for (let index = 0; index < 100; index++) {
          const rankPosition = index + 1;
          
          let sizeClass = 'place-rest';
          if (rankPosition === 1) sizeClass = 'place-1';
          else if (rankPosition === 2) sizeClass = 'place-2';
          else if (rankPosition === 3) sizeClass = 'place-3';

          if (players && players[index]) {
            const player = players[index];
            const rankTier = player.rank ? `${player.rank} ${player.subrank || ''}` : 'Unranked';

            // Clean truncation logic: cut long usernames down to 10 characters followed by ...
            let rawName = player.username || 'Unknown';
            let formattedName = rawName.length > 10 ? rawName.substring(0, 10) + '...' : rawName;

            container.innerHTML += `
              <div class="player-box ${sizeClass}">
                <div class="player-info">
                  <span class="rank-num">#${rankPosition}</span>
                  <div class="username-container">
                    <span class="username">${formattedName}</span>
                    <span class="tier-badge">${rankTier}</span>
                  </div>
                </div>
                <div class="stats">
                  <div class="elo-display">${player.elo || 1000} ELO</div>
                  <div style="font-size: 0.8rem; margin-top:3px;">
                    <span class="win-text">${player.wins || 0}W</span><span class="divider-text">/</span><span class="loss-text">${player.losses || 0}L</span>
                  </div>
                </div>
              </div>
            `;
          } else {
            container.innerHTML += `
              <div class="player-box ${sizeClass} na-box">
                <div class="player-info">
                  <span class="rank-num">#${rankPosition}</span>
                  <div class="username-container">
                    <span class="username">N/A</span>
                    <span class="tier-badge">---</span>
                  </div>
                </div>
                <div class="stats">
                  <div class="elo-display">---- ELO</div>
                  <div style="font-size: 0.8rem; margin-top:3px;">
                    <span class="win-text">0W</span><span class="divider-text">/</span><span class="loss-text">0L</span>
                  </div>
                </div>
              </div>
            `;
          }
        }
      } catch (err) {
        console.error("Data synchronization error:", err);
      }
    }

    function startTimer() {
      setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          timeLeft = 600;
          loadLeaderboard();
        }
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('update-timer').innerText = `Next Sync: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }, 1000);
    }

    loadLeaderboard();
    startTimer();
  </script>
</body>
</html>
